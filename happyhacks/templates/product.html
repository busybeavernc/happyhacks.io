{% extends "base.html" %}
{% block title %}{{ product.name }} · {{ site_name }}{% endblock %}
{% block content %}
<section class="page">
  <div class="wrap narrow">
    <p class="eyebrow"><a href="{{ url_for('index') }}#apps">← All apps</a></p>
    <h1>{{ product.name }}</h1>
    <p class="tagline">{{ product.tagline }}</p>
    <p class="lede">{{ product.description }}</p>
    <p><span class="pill">{{ product.status }}</span></p>
    {% if product.url %}<p><a class="btn" href="{{ product.url }}">Open {{ product.name }} <span aria-hidden="true">→</span></a></p>{% endif %}
  </div>
</section>
{% endblock %}
